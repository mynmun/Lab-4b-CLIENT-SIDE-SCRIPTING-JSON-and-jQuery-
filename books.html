
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>
</head>
<body>
    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle">Loading...</p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor">Loading...</p>

    <h2>Genres by Book</h2>
    <div id="genres"></div>

    <p id="errorMessage" style="color: red;"></p>

    <script>
        async function loadBooks() {
            const errorMessage = document.getElementById("errorMessage");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load the books file.");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) ||
                    data.books.length < 2 ||
                    !data.books.every(book =>
                        typeof book.title === "string" &&
                        typeof book.author === "string" &&
                        Array.isArray(book.genres) &&
                        book.genres.every(g => typeof g === "string")
                    )) {
                    throw new Error("The JSON data has an invalid format.");
                }

                document.getElementById("firstTitle").textContent =
                    data.books[0].title;

                document.getElementById("secondAuthor").textContent =
                    data.books[1].author;

                const genresDiv = document.getElementById("genres");

                data.books.forEach(book => {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresDiv.appendChild(paragraph);
                });

            } catch (error) {
                errorMessage.textContent =
                    "Error: Unable to display book data. " +
                    "Please check books.json and try again.";

                console.error(error);
            }
        }

        loadBooks();
    </script>
</body>
</html>
